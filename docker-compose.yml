services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www

    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy

    command: >
      sh -c "
      if [ ! -f .env ]; then
        cp .env.example .env;
      fi;

      composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress || exit 1;

      if ! grep -q '^APP_KEY=base64:' .env; then
        php artisan key:generate --force;
      fi;

      php artisan migrate --seed --force || exit 1;

      php artisan optimize:clear || exit 1;

      php artisan serve --host=0.0.0.0 --port=8000;
      "

    networks:
      - laravel_network

  mysql:
    image: mysql:8.0

    container_name: laravel_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: task_management_db
      MYSQL_ROOT_PASSWORD: root

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot", "--ssl-mode=DISABLED"]
      interval: 5s
      timeout: 5s
      retries: 20

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    container_name: laravel_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:80"

    networks:
      - laravel_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_queue
    restart: unless-stopped
    working_dir: /var/www

    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini

    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

    command: >
      sh -c "
      until php artisan about >/dev/null 2>&1; do
        sleep 2;
      done;

      php artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600 --no-interaction;
      "

    networks:
      - laravel_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_scheduler
    restart: unless-stopped
    working_dir: /var/www

    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini

    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

    command: >
      sh -c "
      until php artisan about >/dev/null 2>&1; do
        sleep 2;
      done;

      while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done;
      "

    networks:
      - laravel_network

  mailpit:
    image: axllent/mailpit:latest

    container_name: laravel_mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"
      - "1025:1025"

    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  mysql_data: